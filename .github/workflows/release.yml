name: release

# Builds every server as a static binary for linux and darwin (amd64 and arm64) when a version tag is pushed,
# and attaches the archives and their SHA-256 checksums to the GitHub Release of the tag (created here when
# publish-github-packages.yml has not created it yet). Every server.json version must match the tag
# (for example tag v0.1.0 with "version": "0.1.0").

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build, test and attach the server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./scripts/check-server-json
      - name: Check that every server version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in packages/*/server.json; do
            V=$(jq -r .version "$f")
            if [ "$V" != "$TAG" ]; then echo "$f has version $V, tag is $TAG"; exit 1; fi
          done
      - name: Build every server for every platform
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for dir in packages/*/; do
            s=$(basename "$dir")
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              os=${target%/*}; arch=${target#*/}
              name="mcp-$s-$TAG-$os-$arch"
              mkdir -p "dist/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$name/mcp-$s" "./packages/$s/cmd/mcp-$s"
              cp LICENSE "packages/$s/README.md" "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              rm -rf "dist/$name"
            done
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
