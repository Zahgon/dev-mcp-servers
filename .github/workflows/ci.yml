name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test every server (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: go test ./...
      - name: Check every server.json against the MCP registry schema
        run: go run ./scripts/check-server-json

  container-build:
    name: Build the container image for two servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build jwt-tools and git-insights images and start each on stdio
        run: |
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          for s in jwt-tools git-insights; do
            docker build --build-arg SERVER=$s --build-arg VERSION=ci -t mcp-$s:ci .
            printf '%s\n' "$INIT" | timeout 30 docker run --rm -i mcp-$s:ci | grep -q "\"name\":\"$s\""
          done
